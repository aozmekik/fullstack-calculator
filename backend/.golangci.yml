version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - noctx
    - revive
    - unconvert
    - usestdlibvars
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Handler tests drive httptest.NewRequest directly; there is no caller
      # context to propagate.
      - path: _test\.go
        linters: [noctx]

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
